<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>list_item</title>
<style>
/* list_item 组件 CSS（v1.4-b T8 虚拟列表 item 模板）。
   item 自身不设 position——slot 容器由 driver 设 position:absolute;top:real_y;height:item_h。
   本模板供 Instantiate 使用，CSS 样式作为参考；driver 运行时用 CreateNode 创建等同样式节点。 */
.list_item { width:100%; height:80px; flex-direction:row; align-items:center; gap:12px; padding:0 16px; background-color:#252839; }
.item_icon { width:48px; height:48px; }
.item_title { color:#e0e0e0; font-size:20px; }
</style>
</head>
<body>
<div class="list_item">
  <img class="item_icon" src="../res/icons/skin.png">
  <span class="item_title">title</span>
</div>
</body>
</html>
