name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (-D warnings)
        # 历史 warning 已清零（advisory 收紧为严门禁）。可辩护的测试/FFI 模式 lint 在各 crate
        # root 用 #![allow] 显式放行并注明理由；其余真错的已修。
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        run: cargo test --workspace
      - name: feature-gate check (parse feature off)
        # 不带 parse feature（scraper/cssparser）仍须全量编译——验证运行时配置不破。
        run: cargo build --workspace --no-default-features --all-targets

  dll-artifact:
    name: Windows .dll artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build release .dll
        run: cargo build -p loomgui_ffi_c --release
      - name: upload .dll
        uses: actions/upload-artifact@v4
        with:
          name: loomgui_ffi_c-windows-x64
          path: target/release/loomgui_ffi_c.dll
          retention-days: 7
      - name: build release exe (loomgui_pkg)
        run: cargo build -p loomgui_pkg --release
      - name: upload loomgui_pkg.exe
        uses: actions/upload-artifact@v4
        with:
          name: loomgui_pkg-exe-${{ github.sha }}
          path: target/release/loomgui_pkg.exe
          retention-days: 7
