name: Unity Smoke

# Unity EditMode tests via game-ci/unity-test-runner。
# 前置：在家用 Unity 机器生成 .alf → https://license.unity3d.com/manual 换 .ulf →
# 存为 GitHub Secret: UNITY_LICENSE。拿到后把下面 `if: false` 删掉即可。
#
# 生成 .alf 命令（在家跑）：
#   & "C:\Program Files\Unity\Hub\Editor\6000.5.0f1\Editor\Unity.exe" -quit -batchmode -nographics -createManualActivationFile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  editmode-tests:
    name: Unity EditMode tests (Win)
    runs-on: windows-latest
    if: false  # 删掉这行，拿到 UNITY_LICENSE secret 后启用
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: build FFI .dll (current Rust source)
        run: cargo build -p loomgui_ffi_c --release

      - name: stage .dll into package Plugins
        shell: pwsh
        run: |
          Copy-Item target/release/loomgui_ffi_c.dll `
            unity/package/Plugins/LoomGUI/loomgui_ffi_c.dll -Force
          git add unity/package/Plugins/LoomGUI/loomgui_ffi_c.dll
          git add unity/package/Plugins/LoomGUI/Bindings/LoomGUIBindings.cs
      - name: sync bindings via xtask
        run: cargo run -p xtask -- sync-bindings

      - uses: actions/cache@v4
        with:
          path: unity/showcase-unity/Library
          key: unity-library-win-${{ hashFiles('unity/showcase-unity/Packages/manifest.json', 'unity/showcase-unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: unity-library-win-

      - id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: unity/showcase-unity
          unityVersion: 6000.5.0f1
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-editmode-results
          path: ${{ steps.tests.outputs.artifactsPath }}

  playmode-tests:
    name: Unity PlayMode tests (Win)
    runs-on: windows-latest
    if: false  # 和 editmode 一起启用
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: build FFI .dll (current Rust source)
        run: cargo build -p loomgui_ffi_c --release

      - name: stage .dll into package Plugins
        shell: pwsh
        run: |
          Copy-Item target/release/loomgui_ffi_c.dll `
            unity/package/Plugins/LoomGUI/loomgui_ffi_c.dll -Force
          git add unity/package/Plugins/LoomGUI/loomgui_ffi_c.dll
          git add unity/package/Plugins/LoomGUI/Bindings/LoomGUIBindings.cs
      - name: sync bindings via xtask
        run: cargo run -p xtask -- sync-bindings

      - uses: actions/cache@v4
        with:
          path: unity/showcase-unity/Library
          key: unity-library-win-play-${{ hashFiles('unity/showcase-unity/Packages/manifest.json', 'unity/showcase-unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: unity-library-win-play-

      - id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: unity/showcase-unity
          unityVersion: 6000.5.0f1
          testMode: PlayMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-playmode-results
          path: ${{ steps.tests.outputs.artifactsPath }}
