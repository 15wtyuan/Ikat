name: Unity Smoke

# Unity EditMode tests via game-ci/unity-test-runner (https://game.ci)。
# Rust build 会重新生成 .dll 和 LoomGUIBindings.cs，这些改动本质是"与当前源码匹配"，
# git stage 它们保持 working tree clean（Unity 动作不喜脏树）。
#
# 前置：在 repo Settings → Secrets → Actions 配两个 secret：
#   UNITY_EMAIL    = Unity 账号邮箱
#   UNITY_PASSWORD = Unity 账号密码
# （Personal license 自动在线激活，不需要 .ulf）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  editmode-tests:
    name: Unity EditMode tests (Win)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: build FFI .dll (current Rust source)
        run: cargo build -p loomgui_ffi_c --release

      - name: stage .dll into package Plugins
        shell: pwsh
        run: |
          Copy-Item target/release/loomgui_ffi_c.dll `
            loomgui_unity_package/Plugins/LoomGUI/loomgui_ffi_c.dll -Force
          git add loomgui_unity_package/Plugins/LoomGUI/loomgui_ffi_c.dll
          git add loomgui_unity_package/Plugins/LoomGUI/Bindings/LoomGUIBindings.cs

      - uses: actions/cache@v4
        with:
          path: loomgui_unity/Library
          key: unity-library-win-${{ hashFiles('loomgui_unity/Packages/manifest.json', 'loomgui_unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: unity-library-win-

      - id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: loomgui_unity
          unityVersion: 6000.5.0f1
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
