<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>textfield projection fixture</title>
<style>
  #root { width: 200px; height: 200px; }
  /* 围栏 control-css 契约：控件不带 UA 默认样式，需 CSS 命中（display:block 撑满）。 */
  #tf, #ta { background: #ddd; display: block; }
</style>
</head>
<body>
  <div id="root">
    <!-- TextField（role="textbox"，缺省单行）。文本控件 value 取元素文本内容（ARIA 无 textbox-value
         属性），空 div = 空 value。placeholder 走 aria-placeholder。 -->
    <div role="textbox" id="tf" aria-placeholder="name" style="display:block"></div>
    <!-- TextArea（role="textbox" + aria-multiline="true"）：无 Submitted（Enter 插换行）。 -->
    <div role="textbox" id="ta" aria-multiline="true" aria-placeholder="body" style="display:block"></div>
  </div>
</body>
</html>
