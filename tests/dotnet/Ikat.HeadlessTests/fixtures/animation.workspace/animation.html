<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>animation handle fixture</title>
<style>
  /* fade: opacity 0->1. Programmatic node.Play("fade") targets this; the programmatic
     default spec (1s / fill both / cubic-out / single iteration) is applied by core
     play_programmatic. No animation: declaration needed -- the @keyframes table entry
     alone lets Play() resolve the name. */
  @keyframes fade { from { opacity:0; } to { opacity:1; } }

  /* hookanim: 3-stop with @ikat-hook "half" anchored at the 50% stop. The hook comment
     attaches to the PRECEDING stop (50%), so OnHook("half") fires when the player's
     progress crosses 50%. A 0% (from) hook would never fire (crossing semantics: the
     start point never counts as a crossing), so the anchor must be on a mid/late stop. */
  @keyframes hookanim {
    from { opacity:0; }
    50% { opacity:.5; } /* @ikat-hook half */
    to { opacity:1; }
  }
</style>
</head>
<body>
  <div id="root">
    <!-- Programmatic Play targets. Plain divs (-> Container); Node.Play builds the
         player directly via FFI (spec §5.2 programmatic trigger). -->
    <div id="target" style="width:100px;height:40px;">target</div>
  </div>
</body>
</html>
