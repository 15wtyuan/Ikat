<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>control projection fixture</title>
<style>
      .fill { background:#4a9; height:100%; }
      .thumb { background:#333; width:16px; height:16px; }
  #root { width: 200px; height: 100px; }
  /* 控件需 CSS 命中（围栏 control-css 契约：控件不带 UA 默认样式）。 */
  #prog, #sld, #tggl, #rdo, #nf { background: #ddd; }
</style>
</head>
<body>
  <div id="root">
    <!-- 控件一律 role 驱动（spec §2.2）：value/min/max 走 ARIA，step/name 走 data-*。
         围栏禁 div 上 plain 属性，故初始值放 aria-valuenow/aria-valuemin/aria-valuemax/data-step。
         inline controls 显式 display:block（div 默认即 block，保留以明示块级撑满意图）。

         ProgressBar: aria-valuenow + aria-valuemax bake ControlState::Progress (determinate)。
         结构契约（spec §2.2）：progressbar 需 data-slot="fill" 直接子。 -->
    <div role="progressbar" id="prog" aria-valuenow="40" aria-valuemax="100" style="display:block"><div data-slot="fill" class="fill"></div></div>
    <!-- Slider: aria-valuenow required to bake ControlState::Slider。
         结构契约：slider 需 data-slot="thumb" 直接子。 -->
    <div role="slider" id="sld" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100" data-step="5" style="display:block"><div data-slot="thumb" class="thumb"></div></div>
    <!-- Toggle: aria-checked bakes ControlState::Toggle。 -->
    <div role="switch" id="tggl" style="display:block"></div>
    <!-- RadioButton：data-name 承载分组（ARIA 无 radio 组名属性）。 -->
    <div role="radio" id="rdo" data-name="grp" style="display:block"></div>
    <!-- NumberField: aria-valuenow+aria-valuemin+aria-valuemax+data-step bake
         ControlState::NumberField (min/max/step 约束 + set_number_value 走 clamp+量化)。 -->
    <div role="spinbutton" id="nf" aria-valuenow="0" aria-valuemin="0" aria-valuemax="10" data-step="2" style="display:block"></div>
  </div>
</body>
</html>
