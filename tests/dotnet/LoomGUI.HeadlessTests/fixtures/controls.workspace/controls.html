<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>control projection fixture</title>
<style>
  #root { width: 200px; height: 100px; }
  /* 控件需 CSS 命中（围栏 control-css 契约：控件不带 UA 默认样式）。 */
  #prog, #sld, #tggl, #rdo, #nf { background: #ddd; }
</style>
</head>
<body>
  <div id="root">
    <!-- inline controls 显式 display:block（围栏 inline-in-block 契约：作者有意块级撑满）。
         ProgressBar: value + max bake ControlState::Progress (determinate)。 -->
    <progress id="prog" value="40" max="100" style="display:block"></progress>
    <!-- Slider: value attr required to bake ControlState::Slider。 -->
    <input id="sld" type="range" value="50" min="0" max="100" step="5" style="display:block" />
    <!-- Toggle: checked attr bakes ControlState::Toggle。 -->
    <input id="tggl" type="checkbox" style="display:block" />
    <!-- RadioButton。 -->
    <input id="rdo" type="radio" name="grp" style="display:block" />
    <!-- NumberField: value+min+max+step bake ControlState::NumberField (min/max/step 约束 + set_number_value 走 clamp+量化)。 -->
    <input id="nf" type="number" value="0" min="0" max="10" step="2" style="display:block" />
  </div>
</body>
</html>
