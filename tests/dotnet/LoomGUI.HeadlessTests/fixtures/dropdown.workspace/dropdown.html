<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dropdown / option projection fixture</title>
<style>
      .cbval { padding:2px 6px; color:#333; }
  #root { width: 200px; height: 100px; }
  #sel { background: #ddd; display: block; }
  /* option 默认 display:block（围栏 OptionItem::Block）；命中背景验 layout。
     role 选择器替代旧 option tag 选择器。 */
  [role="combobox"] { position: relative; }
  [role="combobox"] [role="listbox"] { display: none; position: absolute; }
  [role="option"] { background: #eee; }
</style>
</head>
<body>
  <div id="root">
    <!-- combobox 含 listbox>option：NodeFactory 应把 option 派发到 OptionItem（非 Container）。
         结构契约（spec §2.2）：combobox 需 role="listbox" 直接子，listbox 需 role="option" 直接子。
         选中态走 aria-selected="true"（打包期 bake ControlState::Dropdown::selected_index）。 -->
    <div role="combobox" id="sel" style="display:block">
      <div data-slot="value" class="cbval">Beta</div>
      <div role="listbox">
        <div role="option" id="opt-a" value="alpha-val">Alpha</div>
        <div role="option" id="opt-b" value="beta-val" aria-selected="true">Beta</div>
        <div role="option" id="opt-c" data-value="c" aria-disabled="true">Gamma</div>
      </div>
    </div>
    <!-- slot / custom-element shell：NodeFactory 派发到 Slot / CustomElement。
         裸 <slot> 只允许出现在组件模板里（围栏），故经注册组件 my-widget 承载。 -->
    <my-widget id="cw">custom</my-widget>
  </div>
</body>
</html>
