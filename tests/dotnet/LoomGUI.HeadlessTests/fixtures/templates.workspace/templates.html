<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>named template fixture</title>
<style>
  #root { width: 300px; height: 200px; }
  [role="listitem"] { width: 100px; height: 30px; background: #ccc; }
</style>
</head>
<body>
  <div id="root">
    <template id="row-tpl">
      <div role="listitem" id="row-item">row</div>
    </template>
  </div>
</body>
</html>
