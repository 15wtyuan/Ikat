<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<base href="..">
<link rel="stylesheet" href="showcase/preview/preview-base.css">
<script src="showcase/preview/loom-preview.js"></script>
<title>虚拟列表页</title>
<style>
/* page_list 组件 CSS（v1.4-b T8 虚拟列表 demo）。
   左半等高列表 + 右半不等高列表，各含 pane-header + scroll 容器。
   scroll 容器设 position:relative 作 slot absolute 包含块；overflow-y:scroll 让 ScrollPane 接管。 */
.root{width:1080px;height:1920px;background-color:#1a1d2e;}
.header{background-color:#252839;border-bottom:2px solid #3a3f55;padding:20px;gap:14px;flex-direction:row;align-items:center;justify-content:space-between;}
.title{color:#e0e0e0;font-size:32px;font-weight:700;}
.back{background-color:#2d3148;border:1px solid #3a3f55;padding:10px 16px;color:#9aa0b4;font-size:18px;}
.back:hover{background-color:#3a4258;color:#5fb2c4;border:1px solid #5fb2c4;}
.back:active{transform:scale(0.96);}
.lists{flex-direction:row;flex-grow:1;}
.list-pane{width:50%;flex-direction:column;}
.pane-header{background-color:#2d3148;padding:12px;border-bottom:1px solid #3a3f55;}
.pane-title{color:#5fb2c4;font-size:18px;font-weight:700;}
.pane-info{color:#9aa0b4;font-size:13px;}
.list-scroll{flex-grow:1;overflow-y:scroll;position:relative;background-color:#1a1d2e;}
</style>
</head>
<body>
<div class="root">
  <div class="header">
    <div class="title">虚拟列表 · 等高 + 不等高</div>
    <div class="back" id="back-home">← 返回</div>
  </div>
  <div class="lists">
    <div class="list-pane">
      <div class="pane-header">
        <div class="pane-title">等高列表 (1000)</div>
        <div class="pane-info">itemH=80px · 可见区间 O(1)</div>
      </div>
      <div class="list-scroll" id="list-equal"></div>
    </div>
    <div class="list-pane">
      <div class="pane-header">
        <div class="pane-title">不等高列表 (200)</div>
        <div class="pane-info">itemH=60~140px · 累加搜索</div>
      </div>
      <div class="list-scroll" id="list-variable"></div>
    </div>
  </div>
</div>
</body>
</html>
