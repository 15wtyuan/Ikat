<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Ikat 靶子冻结 Showcase · 组件类绑定</title>
  <style>
  /* component-lab 页（#20）：RegisterComponent 类绑定 + OnConnected/OnDisconnected。
     页面静态摆两个 lifecycle-widget（进页即 eager 构造 + connect），运行时按钮
     动态加挂（widget-holder 持有者模板）/ 销毁最后。判据 = 肉眼强信号：
     组件出现/消失 + 连接/断开计数读数翻转。 */
  .root {display:flex; width:100vw; height:100vh; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background-color:#0e1620; flex-direction:row; }
  .sidebar {display:flex;flex-direction:column; width:280px; background-color:rgba(21,36,51,0.72); padding:32px 20px; gap:6px; border-width:0 1px 0 0; border-style:solid; border-color:#2a5a75; }
  .side-back { color:#8ec5d8; font-size:14px; margin-bottom:20px; }
  .side-title { color:#e0e6ec; font-size:22px; font-weight:700; margin-bottom:8px; }
  .side-desc { color:#6c7080; font-size:12px; margin-bottom:20px; }
  .readout-label { color:#6c7080; font-size:12px; margin-top:14px; }
  .readout { color:#8ec5d8; font-size:15px; }
  .api-row {display:flex; flex-direction:row; gap:10px; margin-top:18px; }
  .api-btn { color:#e0e6ec; font-size:13px; padding:8px 14px; border-radius:8px; background-color:rgba(26,47,69,0.85); border-width:0 0 0 2px; border-style:solid; border-color:#2a5a75; }
  .api-btn:hover { border-color:#5fb4d4; color:#5fb4d4; }
  .cl-page {display:flex;flex-direction:column; flex-grow:1; padding:48px; gap:16px; }
  .main-title { color:#e0e6ec; font-size:36px; font-weight:700; }
  .section-label { color:#6c7080; font-size:13px; margin-top:16px; }
  .cl-stage {display:flex; flex-direction:row; flex-wrap:wrap; gap:16px; }
  /* ::part() 穿墙（#57）：页面规则穿组件内容墙命中组件内部 part 标记节点。
     .lw-hot 实例的 title/note 被 ::part 换色（金/亮青），无 .lw-hot 的实例保持
     组件默认（灰蓝）——同屏并排对照，无需记忆比对。 */
  .lw-hot::part(title) { color:#f39c12; }
  .lw-hot::part(note) { color:#5fb4d4; }
  </style>
</head>
<body>
  <div class="root">
    <div class="sidebar">
      <button class="side-back" id="back-home">← 返回首页</button>
      <div class="side-title">组件类绑定</div>
      <div class="side-desc">RegisterComponent · 生命周期 · ::part()</div>
      <div class="readout-label">OnConnected 累计</div>
      <span class="readout" id="cl-conn">0</span>
      <div class="readout-label">OnDisconnected 累计</div>
      <span class="readout" id="cl-disc">0</span>
      <div class="api-row">
        <button class="api-btn" id="cl-add">再挂一个</button>
        <button class="api-btn" id="cl-pop">销毁最后</button>
      </div>
    </div>
    <div class="cl-page">
      <div class="main-title">组件类绑定与生命周期</div>
      <div class="section-label">组件实例（进页静态 ×2 · 按钮动态加挂/销毁 · 离页整页销毁）</div>
      <div class="cl-stage" id="cl-stage">
        <lifecycle-widget></lifecycle-widget>
        <lifecycle-widget class="lw-hot"></lifecycle-widget>
      </div>
    </div>
  </div>
</body>
</html>
