<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="preview/preview-base.css">
  <title>infra-card 组件（UnloadPackage 演示载荷）</title>
  <style>
  .card {display:flex;flex-direction:row;align-items:center;gap:12px; width:340px; padding:14px 18px; border-radius:10px; background-color:#1d3a52; box-shadow:inset 0 0 0 1px #2a5a75;}

<body>
  <div class="card">
    <div class="card-dot"></div>
    <div style="display:flex;flex-direction:column;gap:2px">
      <span class="card-title">infra-card · 独立副本</span>
      <span class="card-sub">实例化自 infra-copy 包，卸载后继续存活</span>
    </div>
  </div>
