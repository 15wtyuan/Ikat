<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="preview/preview-base.css">
  <script src="preview/loom-preview.js"></script>
  <title>LoomGUI 靶子冻结 Showcase · 角色创建</title>
  <style>
  .root {display:flex;flex-direction:column; width:1920px; height:1080px; background-color:#0e1620; }
  .body {display:flex;flex-direction:column; flex-grow:1; padding:40px 64px; gap:28px; overflow-y:auto; }
  .page-title { color:#e0e6ec; font-size:32px; font-weight:700; }
  .page-desc { color:#9aa0b4; font-size:15px; }
  .group {display:flex;flex-direction:column; background-color:rgba(21,36,51,0.72); border-radius:10px; padding:28px; gap:18px; }
  .group-title { color:#8ec5d8; font-size:18px; font-weight:700; }
  .field {display:flex; flex-direction:column; gap:8px; }
  .field-label { color:#9aa0b4; font-size:14px; }
  input[type="text"], select, textarea { background-color:rgba(26,47,69,0.85); border-width:0 0 0 2px; border-style:solid; border-color:#2a5a75; color:#e0e6ec; font-size:15px; padding:10px 14px; border-radius:6px; transition:border-color .15s; }
  input[type="text"]:focus, select:focus, textarea:focus { border-color:#5fb4d4; }
  textarea { width:100%; height:100px; resize:none; font-family:inherit; }
  .radio-group {display:flex; flex-direction:row; gap:24px; }
  .radio-opt {display:flex; flex-direction:row; align-items:center; gap:8px; color:#9aa0b4; font-size:15px; }
  input[type="radio"], input[type="checkbox"] {  }
  .slider-field {display:flex; flex-direction:row; align-items:center; gap:16px; }
  .slider-val { color:#d4a44e; font-size:16px; font-weight:700; min-width:40px; }
  input[type="range"] { flex-grow:1;  }
  .actions {display:flex; flex-direction:row; gap:16px; justify-content:flex-end; }
  .btn { padding:12px 32px; border-radius:10px; font-size:16px; font-weight:700; transition:filter .15s; }
  .btn-create { background-color:#d4a44e; color:#0e1620; }
  .btn-reset { background-color:rgba(26,47,69,0.85); color:#9aa0b4; }
  .btn:hover { filter:brightness(1.12); }
  </style>
</head>
<body>
  <div class="root">
    <div class="topbar" style="display:flex;flex-direction:row;align-items:center;gap:12px;padding:20px 32px;background-color:rgba(21,36,51,0.72);border-width:0 0 1px 0;border-style:solid;border-color:#2a5a75">
      <button id="back-home" style="color:#8ec5d8;font-size:15px">← 首页</button><span style="color:#e0e6ec;font-size:20px;font-weight:700">角色创建</span>
    </div>
    <div class="body">
      <div class="page-title">创建新角色</div>
      <div class="page-desc">表单控件编排 · 用 div + p 分组（替代 fieldset/legend）</div>
      <div class="group">
        <div class="group-title">基本信息</div>
        <div class="field"><span class="field-label">角色名</span><input type="text" id="char-name" placeholder="输入角色名" maxlength="12"></div>
      </div>
      <div class="group">
        <div class="group-title">职业与出身</div>
        <div class="field"><span class="field-label">职业</span>
          <select id="char-class">
            <option value="ranger">游侠</option>
            <option value="mage">法师</option>
            <option value="warrior">战士</option>
            <option value="assassin">刺客</option>
          </select>
        </div>
      </div>
      <div class="group">
        <div class="group-title">性别与阵营</div>
        <div class="radio-group">
          <div class="radio-opt"><input type="radio" id="g-m" name="gender" checked><span>男</span></div>
          <div class="radio-opt"><input type="radio" id="g-f" name="gender"><span>女</span></div>
          <div class="radio-opt"><input type="radio" id="a-light" name="faction" checked><span>光明阵营</span></div>
          <div class="radio-opt"><input type="radio" id="a-dark" name="faction"><span>暗影阵营</span></div>
        </div>
      </div>
      <div class="group">
        <div class="group-title">初始属性分配</div>
        <div class="field"><span class="field-label">力量</span>
          <div class="slider-field"><input type="range" id="attr-str" min="0" max="20" value="10"><span class="slider-val">10</span></div>
        </div>
        <div class="field"><span class="field-label">敏捷</span>
          <div class="slider-field"><input type="range" id="attr-agi" min="0" max="20" value="12"><span class="slider-val">12</span></div>
        </div>
        <div class="field"><span class="field-label">智力</span>
          <div class="slider-field"><input type="range" id="attr-int" min="0" max="20" value="8"><span class="slider-val">8</span></div>
        </div>
      </div>
      <div class="group">
        <div class="group-title">背景故事</div>
        <div class="field"><span class="field-label">简介（textarea）</span><textarea id="char-bio" rows="4" cols="60" maxlength="200" placeholder="一段角色背景故事..."></textarea></div>
      </div>
      <div class="actions">
        <button class="btn btn-reset">重置</button>
        <button class="btn btn-create">创建角色</button>
      </div>
    </div>
  </div>
</body>
</html>
