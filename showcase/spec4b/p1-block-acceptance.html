<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>P1 Block Acceptance</title>
  <style>
    /* C2 acceptance page: discriminates pseudo-block (flex-column) from real block.
       The single signal is child height under flex-grow:
         - pseudo-block maps display:block → taffy Flex, honors flex-grow → child grows to ~140.
         - real block ignores flex-grow → child stays at explicit 40px.
       width and y-stacking do NOT discriminate (verified via layout dump):
         - width:100px is not stretched by either flex-column (align-items stretch is cross-axis) or block.
         - Both modes stack vertically (flex-direction:column main-axis vs block normal flow).
       Discriminator was empirically confirmed via dump_p1block_probe: cg1.h=140 under pseudo-block. */
    .root { width: 400px; height: 300px; background-color: #111; }
    .stack { display: block; width: 400px; height: 280px; }
    .item { width: 100px; height: 40px; flex-grow: 1; background-color: #e94560; }
  </style>
</head>
<body>
  <div class="root">
    <div class="stack" id="stack">
      <div class="item" id="c1"></div>
      <div class="item" id="c2"></div>
    </div>
  </div>
</body>
</html>
