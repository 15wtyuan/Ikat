<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dropdown + NumberField Acceptance</title>
  <style>
  /* Task 17 acceptance page: exercises Dropdown (<select> + <option>) and NumberField
     (<input type="number">) end-to-end through the full pipeline.

     What it proves:
       1. RENDER — select box shows selected option text (.loom-value); clicking opens the
          .loom-popup which floats ABOVE sibling content and ESCAPES the parent's
          overflow:hidden (popup is detached in render: mask_context=0, appended at end of
          the render list). The self-drawn arrow proves the fence teaching "dropdowns have
          NO built-in arrow — author draws it".
       2. SelectedIndex read/write + SelectionChanged event (typed API, verified in PlayMode).
       3. Keyboard Up/Down/Enter/Esc on the open dropdown.
       4. NumberField accepts digit input and clamps to [min,max] with step quantization.

     CSS notes — every control MUST be hit by a CSS rule (fence FenceControlWithoutCss):
       - select               : the box itself (background/border so it's visible)
       - .loom-value          : injected child showing the selected text
       - .loom-popup          : injected popup container holding the <option> list
       - option               : option rows (normal DOM children of <select>)
       - input[type="number"] : the number field box
     The arrow is drawn as an author-provided sibling element (.arrow, a small solid marker) —
     this is the "author draws the arrow" path the fence teaching requires. */

  /* reset (mirrors spec4b-acceptance: strip browser UA so the .html preview matches LoomGUI's
     no-UA runtime). class rules below override. */
  button { background-color: transparent; border-color: transparent; box-shadow: none; text-align: center; padding: 0; margin: 0; }
  img { display: block; margin: 0; }

  .root { display:flex; flex-direction:column; width:1280px; height:720px; background-color:#1a1a2e; font-family: LXGWWenKai; }
  .header { display:flex; flex-direction:row; align-items:center; gap:12px; padding:16px 24px; background-color:#16213e; }
  .header-title { color:#e0e6ec; font-size:22px; font-weight:700; }
  .body { display:flex; flex-direction:column; flex-grow:1; padding:24px; gap:24px; }
  .page-title { color:#e0e6ec; font-size:20px; font-weight:700; }
  .row { display:flex; flex-direction:row; align-items:flex-start; gap:32px; }

  /* ── Dropdown acceptance zone ───────────────────────────────────────
     .clip-frame has overflow:hidden AND a fixed small height. When the dropdown opens, the
     .loom-popup list is TALLER than the frame. Correct behaviour: the popup still renders
     fully (it escapes the clip via render-layer mask=0 detatch). Wrong behaviour (regression):
     the popup gets clipped by overflow:hidden and the lower options are invisible. */
  .clip-frame {
    display:flex; flex-direction:column;
    width:360px; height:96px;            /* deliberately short so the open popup overflows it */
    overflow:hidden;
    background-color:#0f3460;
    border:2px dashed #e94560;           /* dashed red = the clip boundary, visual reference */
    padding:12px; gap:8px;
  }
  .frame-label { color:#8ec5d8; font-size:12px; }
  /* select: the box. display:block so it stacks in the block-flow .clip-frame. It lives in a
     relative-positioned .sel-wrap so the absolutely-positioned .arrow sibling overlays it. */
  .sel-wrap { display:flex; position:relative; width:220px; height:40px; }
  select {
    display:block;
    width:220px; height:40px;
    background-color:#16213e;
    border:2px solid #4a90d9;
    color:#e0e6ec; font-size:14px;
  }
  /* .loom-value: injected child showing the selected option's text. padding-right keeps the
     text clear of the arrow overlay drawn by the .arrow sibling (see below). */
  .loom-value {
    width:220px; height:40px;
    background-color:#16213e;
    color:#e0e6ec; font-size:14px;
    padding:0 32px 0 12px;
  }
  /* .arrow: the self-drawn dropdown indicator. The fence teaching says dropdowns have NO
     built-in arrow — the author must draw one. Here we draw a small solid marker square via
     background-color (only fence-core props: position/width/height/background-color) to prove
     the author-CSS path works end to end. Remove this rule and the marker vanishes — no UA
     fallback (contrast with a browser <select> which always shows its own arrow). A prettier
     triangle would need a packed image asset (background-image url) — out of scope for this
     minimal acceptance page; the marker suffices to prove the teaching. */
  .arrow {
    position:absolute;
    right:10px; top:10px;
    width:12px; height:12px;
    background-color:#4a90d9;
  }
  /* .loom-popup: injected popup container. Give it a solid background + border so the
     floating option list is visible above neighbouring content. Width matches the box. */
  .loom-popup {
    width:220px;
    background-color:#16213e;
    border:2px solid #4a90d9;
  }
  /* option: rows inside .loom-popup. display:block (fence OptionItem::Block default).
     A distinct background on option proves each option lays out (hit target + render). */
  option {
    display:block;
    width:220px; height:32px;
    background-color:#16213e;
    color:#e0e6ec; font-size:14px;
    padding:0 12px;
  }

  /* ── NumberField acceptance zone ────────────────────────────────────
     min=0 max=10 step=2 → valid clamped values are 0,2,4,6,8,10. Typing 7 should clamp+quantize
     to 8 (nearest step within range); typing 99 clamps to 10; typing -5 clamps to 0. */
  .num-frame {
    display:flex; flex-direction:column; gap:8px;
    width:240px;
    background-color:#0f3460;
    border:2px dashed #4a90d9;
    padding:12px;
  }
  input[type="number"] {
    display:block;
    width:180px; height:40px;
    background-color:#16213e;
    border:2px solid #4a90d9;
    color:#e0e6ec; font-size:14px;
    caret-color:#e94560;
    padding:0 12px;
  }
  .num-hint { color:#8ec5d8; font-size:12px; }

  .log { display:block; color:#8ec5d8; font-size:13px; }
  </style>
</head>
<body>
  <div class="root">
    <div class="header">
      <span class="header-title">Dropdown + NumberField Acceptance</span>
    </div>
    <div class="body">
      <div class="page-title">Controls (Task 17)</div>
      <div class="row">
        <!-- Gate 1 + overflow escape: dropdown sits inside a short overflow:hidden frame.
             Opening it must show all 3 options floating past the dashed red boundary. -->
        <div class="clip-frame" id="clip-frame">
          <span class="frame-label">overflow:hidden frame — popup must escape it</span>
          <div class="sel-wrap">
            <select id="sel-quality" name="quality">
              <option id="opt-low"    value="low">Low</option>
              <option id="opt-medium" value="medium" selected>Medium</option>
              <option id="opt-high"   value="high">High</option>
            </select>
            <!-- Self-drawn arrow sibling (fence teaching: no built-in arrow, author draws it). -->
            <span class="arrow" id="sel-arrow"></span>
          </div>
        </div>
        <!-- Gate 4: NumberField with min/max/step for clamp+quantize verification. -->
        <div class="num-frame" id="num-frame">
          <span class="num-hint">number: min=0 max=10 step=2 (try 7→8, 99→10, -5→0)</span>
          <input type="number" id="nf-count" value="4" min="0" max="10" step="2">
        </div>
      </div>
      <span class="log">PlayMode checklist: (1) popup escapes overflow; (2) SelectedIndex + SelectionChanged; (3) Up/Down/Enter/Esc; (4) NumberField clamp.</span>
    </div>
  </div>
</body>
</html>
