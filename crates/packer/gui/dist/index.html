<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LoomGUI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Start Screen -->
    <div id="start-screen" class="screen">
      <header class="start-header">
        <h1>LoomGUI</h1>
      </header>

      <section class="recent-section">
        <h2>最近工作区</h2>
        <div id="recent-list" class="recent-list">
          <p class="empty-msg">暂无最近使用的工作区</p>
        </div>
      </section>

      <footer class="start-actions">
        <button id="btn-new" class="btn btn-primary">新建工作区</button>
        <button id="btn-open" class="btn btn-secondary">打开工作区</button>
      </footer>
    </div>

    <!-- Main Editor Screen -->
    <div id="main-screen" class="screen hidden">
      <header class="main-header">
        <button id="btn-back" class="btn btn-ghost">&larr; 返回</button>
        <h1>LoomGUI</h1>
        <span id="main-path" class="main-path"></span>
        <div class="header-actions">
          <button id="btn-log" class="btn btn-ghost">日志</button>
          <button id="btn-build" class="btn btn-primary">打包</button>
        </div>
      </header>

      <nav class="tabs">
        <button class="tab active" data-tab="general">通用</button>
        <button class="tab" data-tab="packages">包</button>
        <button class="tab" data-tab="atlases">图集</button>
        <button class="tab" data-tab="fonts">字体</button>
      </nav>

      <div class="tab-panels">
        <section class="tab-panel active" id="panel-general">
          <div class="section-body" id="section-general-body"></div>
        </section>
        <section class="tab-panel" id="panel-packages">
          <div class="section-body" id="section-pkg-body"></div>
        </section>
        <section class="tab-panel" id="panel-atlases">
          <div class="section-body" id="section-atlas-body"></div>
        </section>
        <section class="tab-panel" id="panel-fonts">
          <div class="section-body" id="section-font-body"></div>
        </section>
      </div>
    </div>

    <!-- Build Log Modal -->
    <div id="log-overlay" class="modal-overlay hidden">
      <div class="modal log-modal">
        <div class="modal-header">
          <h3>打包日志</h3>
          <button id="btn-log-close" class="btn btn-ghost btn-close">&times;</button>
        </div>
        <div id="build-log" class="build-log">
          <p class="empty-msg">点击「打包」开始构建</p>
        </div>
      </div>
    </div>

    <!-- Init Agent Scaffold Modal -->
    <div id="init-overlay" class="modal-overlay hidden">
      <div class="modal">
        <h3>初始化 agent 脚手架</h3>
        <p class="modal-desc">勾选要初始化的 agent（可多选）。同名文件会被覆盖，不碰 workspace.json 和源文件。</p>
        <label class="agent-option">
          <input type="checkbox" id="init-check-claude" checked />
          <div class="agent-option-body">
            <span class="agent-option-name">Claude</span>
            <span class="agent-option-path">CLAUDE.md + .claude/skills/</span>
          </div>
        </label>
        <label class="agent-option">
          <input type="checkbox" id="init-check-agents" checked />
          <div class="agent-option-body">
            <span class="agent-option-name">其他</span>
            <span class="agent-option-path">AGENTS.md + .agents/skills/</span>
            <span class="agent-option-note">Codex / ZCode 等 AGENTS.md 约定</span>
          </div>
        </label>
        <div class="modal-actions">
          <button id="btn-init-cancel" class="btn btn-secondary">取消</button>
          <button id="btn-init-ok" class="btn btn-primary">初始化</button>
        </div>
      </div>
    </div>

    <script src="editor.js"></script>
    <script src="app.js"></script>
  </body>
</html>
