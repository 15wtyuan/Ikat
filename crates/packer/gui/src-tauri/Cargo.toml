[package]
name = "ikat_gui"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ikat_pkg = { path = "../../pkg" }
tauri-plugin-dialog = "2"

[dev-dependencies]
ikat_fence = { path = "../../../fence" }
