<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>cascade probe</title>
<!--
  Cascade-finalization probe fixture.

  Deliberately stays inside what the current selector parser + cascade engine
  already support, so it round-trips HTML -> pkg -> Stage -> layout today.
  Selector subset : class / tag / id / descendant / pseudo-class (hover/active/disabled/focus) / attribute [role=..]
  Property subset: display / flex-direction / width / height / color / font-size
  Controls are role-driven (spec §2.2): <div role="...">. Each control needs a
  matching CSS rule (controls carry no UA default style) and its required child
  structure (control_structure_check, spec §2.2).

  What the Stage public API can assert today: rect / visible / find_node_by_id /
  get_node_computed_style / get_node_kind.
-->
<style>
div { display: flex; flex-direction: column; }
#root { width: 320px; font-size: 14px; color: #222222; }
.row { flex-direction: row; }
.title { font-size: 20px; color: #114488; }
.muted { color: #888888; }
.row .lbl { font-size: 12px; }
#root .title { color: #0066aa; }
button { color: #ffffff; }
button:hover { color: #dddddd; }
button:active { color: #ffeeaa; }
button:disabled { color: #666666; }
button:focus { color: #aaffff; }
[role="slider"] { width: 200px; }
[role="progressbar"] { width: 160px; height: 8px; }
[role="combobox"] { width: 200px; position: relative; }
[role="combobox"] [role="listbox"] { display: none; position: absolute; }
[role="option"] { color: #222222; }
[role="switch"] { width: 24px; height: 24px; }
.hidden { display: none; }
</style>
</head>
<body>
<div id="root">
  <div class="title" id="title">音量设置</div>
  <div class="row" id="row-vol">
    <span class="lbl" id="lbl-master">主音量</span>
    <div role="slider" id="vol" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100" data-step="1"><div data-slot="thumb"></div></div>
    <span class="muted" id="vol-val">80</span>
  </div>
  <div class="row" id="row-mute">
    <div role="switch" id="mute" aria-checked="false"></div>
    <span>静音</span>
  </div>
  <div role="progressbar" id="pb" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"><div data-slot="fill"></div></div>
  <div class="row" id="row-quality">
    <div role="combobox" id="quality">
      <div role="listbox">
        <div role="option" aria-selected="false">低</div>
        <div role="option" aria-selected="true">高</div>
      </div>
    </div>
  </div>
  <div role="list" id="hints">
    <div role="listitem" id="li1">提示一</div>
    <div role="listitem">提示二</div>
  </div>
  <div class="row" id="row-actions">
    <button id="save">保存</button>
    <button id="cancel" disabled>取消</button>
    <button class="hidden" id="ghost">不应渲染</button>
  </div>
</div>
</body>
</html>
