[package]
name = "loomgui_pkg"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "loom-pkg"
path = "src/main.rs"

[dependencies]
loomgui_core = { path = "../../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
etagere = "0.3"
