[package]
name = "loomgui_pkg"
# 与 unity/package/package.json 同轨（release-check 断言）；`loom version` 的 cli/unity
# 字段都取本值。发版 tag 前必须先 bump 两者 + 补 CHANGELOG。
version = "0.0.10"
edition = "2021"

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
loomgui_core = { path = "../../core" }
loomgui_fence = { path = "../../fence" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
etagere = "0.3"

[dev-dependencies]
taffy = { version = "0.12", features = ["serde"] }
