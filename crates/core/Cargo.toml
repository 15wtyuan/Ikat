[package]
name = "loomgui_core"
version = "0.1.0"
edition = "2021"


[dependencies]
taffy = { version = "0.12", features = ["serde"] }
bitflags = { version = "2", features = ["serde"] }
ttf-parser = "0.20"
ab_glyph_rasterizer = "0.1"
etagere = "0.3"
unicode-linebreak = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
# slotmap: Scene.nodes uses SlotMap<DefaultKey, Node>. The application-layer
# NodeId(pub u32) bridges to/from slotmap DefaultKey via from_ffi/as_ffi
# (see scene/node.rs NodeId impl and Scene::key_for).
slotmap = { version = "1.1", features = [] }

[dev-dependencies]
loomgui_pkg = { path = "../packer/pkg" }
# solve 基准（benches/solve.rs）：增量 vs 全重建帧时对拍。cargo test 不跑 bench。
criterion = "0.5"

[[bench]]
name = "solve"
harness = false

# #9 动画并发基准（tween 池化推进 / player update_all / churn 回池）。
[[bench]]
name = "anim"
harness = false
